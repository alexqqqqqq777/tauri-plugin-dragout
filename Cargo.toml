[package]
name = "tauri-plugin-dragout"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-dragout"
description = "Native drag-out for Tauri 2 on macOS: drag real files, generated bytes or lazy file promises from your webview to Finder, the Desktop, Mail or any other app."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexqqqqqq777/tauri-plugin-dragout"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "drag-and-drop", "macos", "file-promise"]
categories = ["gui", "os::macos-apis"]
exclude = [".github/*", "examples/*", "docs/*"]

[dependencies]
tauri = "2"
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", features = ["exception"] }
cocoa = "0.26"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
